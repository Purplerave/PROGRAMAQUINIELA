name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  lint:
    name: Lint y contrato de estilo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias de desarrollo (lock con hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock.txt
      - name: Ruff completo (pyproject.toml)
        run: python -m ruff check .
      - name: Comprobar espacios en blanco del diff
        run: |
          base=$(git merge-base origin/main HEAD)
          git diff --check "$base" HEAD

  tests:
    name: Suite de tests (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias (lock con hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Comprobar que no hay dependencias rotas
        run: python -m pip check

      - name: Suite de tests
        run: python -m pytest tests/ -q

  contrato-columnas:
    name: Contrato de columnas P0 (3 dobles = 8 columnas = 6,00 EUR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt

      - name: Validar contrato y optimizador
        run: |
          python - <<'EOF'
          import json
          import settings
          from OPTIMIZADOR_COLUMNAS import columns_contract, three_double_combinations, optimize_jornada

          c = columns_contract()
          assert c["doubles"] == 3, c
          assert c["columns_per_ticket"] == 8, c
          assert c["price_per_column"] == 0.75, c
          assert c["max_cost"] == 6.0, c
          assert 2 ** c["doubles"] == c["columns_per_ticket"]
          assert len(three_double_combinations(14, 3)) == 364

          payload = optimize_jornada(74, fuente_prob="q15", publico="lae", n_sims=2000)
          assert payload["n_columnas"] == 8
          assert payload["coste_euros"] == 6.0
          assert payload["evaluacion_exhaustiva"]["n_combinaciones"] == 364
          assert set(payload["probabilidades_exactas"]) == {
              "p_ge_10", "p_ge_11", "p_ge_12", "p_ge_13", "p_ge_14",
          }
          assert payload["pleno15"]["num"] == 15
          assert all(d["num"] != 15 for d in payload["desarrollo"])
          print("Contrato P0 OK:", json.dumps(c, ensure_ascii=False))
          EOF

  referencia-cerrada:
    name: Reproducibilidad del backtest oficial cerrado
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt
      - run: make sanitize
      - run: python scripts/reports/GENERAR_PRODUCTION_REFERENCE.py --skip-tests --out salida/referencia_ci.json

  procedencia:
    name: Procedencia y licencias de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/datos/VERIFICAR_PROCEDENCIA.py
